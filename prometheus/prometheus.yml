global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # --- La stack elle-même ---
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: alertmanager
    static_configs: [{ targets: ["alertmanager:9093"] }]
  - job_name: loki
    static_configs: [{ targets: ["loki:3100"] }]
  - job_name: blackbox
    static_configs: [{ targets: ["blackbox:9115"] }]
  - job_name: snmp_exporter
    static_configs: [{ targets: ["snmp-exporter:9116"] }]
  - job_name: netmap
    static_configs: [{ targets: ["host.docker.internal:8088"] }]

  # --- Sondes : tout ce que netmap a découvert + les équipements de config/netmap.yml ---
  - job_name: blackbox_icmp
    metrics_path: /probe
    params: { module: [icmp] }
    file_sd_configs:
      - files: ["/etc/prometheus-targets/icmp.json"]
    relabel_configs: &probe_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox_tcp
    metrics_path: /probe
    params: { module: [tcp_connect] }
    file_sd_configs:
      - files: ["/etc/prometheus-targets/tcp.json"]
    relabel_configs: *probe_relabel

  - job_name: blackbox_http
    scrape_interval: 60s
    metrics_path: /probe
    params: { module: [http_2xx] }
    file_sd_configs:
      - files: ["/etc/prometheus-targets/http.json"]
    relabel_configs: *probe_relabel

  - job_name: blackbox_dns
    scrape_interval: 60s
    metrics_path: /probe
    params: { module: [dns] }
    file_sd_configs:
      - files: ["/etc/prometheus-targets/dns.json"]
    relabel_configs: *probe_relabel

  # --- Ports des switchs / firewalls par SNMP (cibles écrites par le cockpit depuis config/netmap.yml)
  - job_name: snmp
    scrape_interval: 60s
    scrape_timeout: 50s
    metrics_path: /snmp
    params: { module: [if_mib], auth: [site] }
    file_sd_configs:
      - files: ["/etc/prometheus-targets/snmp.json"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116
