# Point d'entrée des agents sur le réseau (ports 9090 et 3100 de la machine de supervision).
# Seuls les envois des agents passent : POST /api/v1/write vers Prometheus, POST /loki/api/v1/push vers Loki,
# avec le jeton d'agent (AGENT_TOKEN du .env) : sans lui, 401. Le contrôle du jeton est généré par scripts/render_config.py
# dans secrets/agent-gateway.conf (variable $agent_denied) ; AGENT_AUTH=optional accepte aussi les envois sans jeton.
# Tout le reste (consulter les métriques ou les logs, administrer Prometheus ou Loki) répond 403 :
# Prometheus et Loki ne sont joignables que depuis cette machine (127.0.0.1:9091 et 127.0.0.1:3101) et par Grafana.
worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    access_log off;
    client_max_body_size 32m;
    client_body_buffer_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";   # le jeton s'arrête ici : Prometheus et Loki ne le voient jamais
    # DNS de Docker : les noms sont résolus à nouveau, un Prometheus ou un Loki redémarré est suivi.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/agent-token.conf;

    server {
        listen 9090;
        location = /api/v1/write {
            limit_except POST { deny all; }
            if ($request_method != POST) { return 403; }
            if ($agent_denied) { return 401; }
            set $prometheus http://prometheus:9090;
            proxy_pass $prometheus;
        }
        location / {
            return 403;
        }
    }

    server {
        listen 3100;
        location = /loki/api/v1/push {
            limit_except POST { deny all; }
            if ($request_method != POST) { return 403; }
            if ($agent_denied) { return 401; }
            set $loki http://loki:3100;
            proxy_pass $loki;
        }
        location / {
            return 403;
        }
    }
}
