name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Which problem would it solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: textarea
    id: context
    attributes:
      label: Your environment (optional)
      description: Number of sites/servers, hypervisor, network vendor, what you have access to…
