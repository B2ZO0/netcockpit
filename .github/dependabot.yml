# Mises à jour automatiques des dépendances (une pull request par mise à jour, à valider)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /cockpit
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /cockpit
    schedule:
      interval: monthly
