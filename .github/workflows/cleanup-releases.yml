name: Clean up releases

# Deletes every release and tag except the one to keep (run manually from the Actions tab).
on:
  workflow_dispatch:
    inputs:
      keep:
        description: "Tag to keep"
        default: "v1.1.0"
        required: true

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ inputs.keep }}
        run: |
          for tag in $(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName'); do
            [ "$tag" = "$KEEP" ] && continue
            echo "delete release $tag"; gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
          for tag in $(gh api "repos/$GITHUB_REPOSITORY/tags" --jq '.[].name'); do
            [ "$tag" = "$KEEP" ] && continue
            echo "delete tag $tag"; gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" || true
          done
          gh release edit "$KEEP" -R "$GITHUB_REPOSITORY" --latest || true
