# Publie automatiquement une release dès qu'une nouvelle version apparaît en tête de CHANGELOG.md.
# Pour sortir une version : ajouter "## X.Y.Z" et ses notes en haut du CHANGELOG, puis pousser sur main.
name: Release

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md, scripts/release_notes.py, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish the newest CHANGELOG version if it is not released yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 -oP '^## \K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released, nothing to do."
            exit 0
          fi
          python3 scripts/release_notes.py "$version" > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "NetCockpit ${version}" --notes-file notes.md --latest
          echo "::notice::Released $tag"
