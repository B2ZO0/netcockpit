# Publie une release, seulement quand tu le décides (onglet Actions → Release → Run workflow).
# Avant : renomme "## Unreleased" en "## X.Y.Z" en haut de CHANGELOG.md et pousse sur main.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the newest CHANGELOG version if it is not released yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if head -20 CHANGELOG.md | grep -q '^## Unreleased'; then
            echo "::error::Rename '## Unreleased' to '## X.Y.Z' in CHANGELOG.md first."
            exit 1
          fi
          version=$(grep -m1 -oP '^## \K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released, nothing to do."
            exit 0
          fi
          python3 scripts/release_notes.py "$version" > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "NetCockpit ${version}" --notes-file notes.md --latest
          echo "::notice::Released $tag"
