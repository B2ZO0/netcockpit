name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      # Every commit is signed by the maintainer: no bot or AI-assistant author, no co-author line.
      - name: Commit authorship
        run: |
          bad=$(git log HEAD --format='%h %an <%ae>%n%B' | grep -i -E 'noreply@anthropic\.com|^co-authored-by:.*(claude|anthropic)|^claude-session:|dependabot\[bot\]|^[0-9a-f]{7,} claude ' || true)
          if [ -n "$bad" ]; then echo "::error::Commits must be authored by the maintainer, without bot or AI co-author lines:"; echo "$bad"; exit 1; fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "20" }

      - name: Python
        run: |
          pip install pyyaml requests
          python -m py_compile cockpit/app/*.py scripts/*.py demo/demo.py
          python -m unittest discover -s tests -v

      - name: JavaScript
        run: for f in cockpit/static/*.js; do node --check "$f"; done

      - name: Shell
        run: bash -n setup.sh scripts/update.sh agents/linux/install.sh

      - name: YAML and dashboards
        run: |
          python - <<'PY'
          import glob, json, yaml
          for f in glob.glob("**/*.yml", recursive=True) + glob.glob(".github/**/*.yml", recursive=True):
              yaml.safe_load(open(f, encoding="utf-8"))
          for f in glob.glob("grafana/dashboards/*.json"):
              json.load(open(f, encoding="utf-8"))
          print("ok")
          PY

      - name: Prometheus rules (promtool)
        run: |
          files=$(cd prometheus && ls rules/*.yml | sed 's#^#/p/#')
          docker run --rm -v "$PWD/prometheus:/p" --entrypoint promtool prom/prometheus check rules $files

      - name: Loki rules
        run: |
          python - <<'PY'
          import yaml; yaml.safe_load(open("loki/rules/fake/logs.yml"))
          PY

      - name: Compose file and Alertmanager config (amtool)
        run: |
          cp .env.example .env
          sed -i 's/__RANDOM__/ci-password/g' .env
          echo "AGENT_TOKEN=ci-agent-token-0123456789" >> .env
          echo "TELEGRAM_BOT_TOKEN=123:abc" >> .env && echo "TELEGRAM_CHAT_ID=-100123" >> .env
          python scripts/render_config.py
          docker compose config -q
          docker run --rm -v "$PWD/secrets/alertmanager.yml:/am/alertmanager.yml:ro" --entrypoint amtool prom/alertmanager check-config /am/alertmanager.yml

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Every pinned image of the stack exists (Zabbix included)
        run: |
          cp .env.example .env
          sed -i 's/__RANDOM__/ci-password/g' .env
          echo "AGENT_TOKEN=ci-agent-token-0123456789" >> .env
          docker compose --profile zabbix pull --quiet --ignore-buildable
          docker compose --profile zabbix config --images | sort

      - name: Settings and generated files, as ./setup.sh does
        run: |
          echo "TELEGRAM_BOT_TOKEN=123:abc" >> .env && echo "TELEGRAM_CHAT_ID=-100123" >> .env
          echo "SNMP_COMMUNITY=ci-community" >> .env
          python3 scripts/render_config.py
          mkdir -p data/targets && for f in icmp tcp http dns snmp; do echo "[]" > "data/targets/$f.json"; done
          stat -c '%a %n' secrets secrets/*

      - name: Start the stack (without the cockpit and Zabbix)
        run: docker compose up -d prometheus loki alertmanager agent-gateway snmp-exporter blackbox syslog grafana

      - name: Agents can push with the token; nobody else can push, read or administer Prometheus and Loki
        run: python3 tests/stack_check.py "$(hostname -I | awk '{print $1}')"

      - name: Updated installs (AGENT_AUTH=optional) still accept agents installed without the token, never a wrong one
        run: |
          echo "AGENT_AUTH=optional" >> .env
          python3 scripts/render_config.py
          docker compose restart agent-gateway
          sleep 2
          python3 tests/stack_check.py "$(hostname -I | awk '{print $1}')" --optional
          sed -i '$d' .env
          python3 scripts/render_config.py
          docker compose restart agent-gateway

      - name: Alertmanager and the SNMP exporter read their secret files; every service keeps running
        run: |
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:9093/-/ready >/dev/null && break; sleep 2; done
          curl -fs http://127.0.0.1:9093/api/v2/status | python3 -c "import json,sys; c=json.load(sys.stdin)['config']['original']; assert 'telegram_configs' in c and 'chat_id: -100123' in c and 'bot_token: <secret>' in c, c; print('alertmanager: telegram receiver loaded (token masked by Alertmanager)')"
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:3000/api/health >/dev/null && break; sleep 2; done
          for ds in prometheus loki; do   # Grafana still reaches them on the Docker network
            curl -fs -u admin:ci-password "http://127.0.0.1:3000/api/datasources/uid/$ds/health" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print('grafana -> $ds:', d); assert d.get('status') == 'OK'"
          done
          sleep 5
          for svc in prometheus loki alertmanager agent-gateway snmp-exporter blackbox syslog grafana; do
            state=$(docker inspect -f '{{.State.Status}} {{.RestartCount}}' "$(docker compose ps -q "$svc")")
            echo "$svc: $state"; [ "$state" = "running 0" ]
          done

      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs --tail 80
          for svc in prometheus loki alertmanager agent-gateway snmp-exporter blackbox syslog grafana; do
            echo "== $svc: $(docker inspect -f '{{.State.Status}} restarts={{.RestartCount}} exit={{.State.ExitCode}} error={{.State.Error}}' "$(docker compose ps -aq "$svc")")"
          done
          echo "== grafana, first lines (all runs of the container)"; docker compose logs --no-log-prefix grafana | grep -iE 'error|fatal|panic|exit|shutdown|stopp|signal' | head -60

  demo-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the demo
        run: docker compose -f docker-compose.demo.yml up -d --build
      - name: API answers with a populated model
        run: |
          for i in $(seq 1 30); do curl -fs http://localhost:8088/health && break; sleep 2; done
          sleep 15
          curl -fs http://localhost:8088/api/overview | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['stats']['total'] > 50, d['stats']; print(d['stats'])"
          curl -fs http://localhost:8088/api/graph | python3 -c "import json,sys; d=json.load(sys.stdin); assert any(n['role']=='esxi' for n in d['nodes']); print(len(d['nodes']), 'nodes')"
      - name: Discovery works with the capabilities of docker-compose.yml (host network, NET_RAW, no NET_ADMIN)
        run: |
          # The only target is a throwaway container on this runner's Docker bridge: nothing else is scanned.
          docker run -d --name scan-target --entrypoint python localhost/netcockpit/cockpit:local -m http.server 8000
          T=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' scan-target)
          sleep 2
          cockpit() { docker run --rm --network host --cap-add NET_RAW localhost/netcockpit/cockpit:local "$@"; }
          caps=$(cockpit sh -c 'grep CapEff /proc/self/status')
          echo "effective capabilities: $caps"
          python3 -c "import sys; eff = int(sys.argv[1].split()[1], 16); assert eff & (1 << 13), 'NET_RAW missing'; assert not eff & (1 << 12), 'NET_ADMIN present'" "$caps"
          out=$(cockpit nmap -sn -n -oX - "$T"); echo "$out" | grep -E 'address|status' || true
          [[ "$out" == *'addrtype="mac"'* ]]                                   # ARP ping on the local segment
          out=$(cockpit nmap -Pn -n -sS -p 8000 -oX - "$T"); echo "$out" | grep -E '<port ' || true
          [[ "$out" == *'portid="8000"><state state="open"'* ]]                # SYN scan (raw packets)
          out=$(cockpit nmap -Pn -n -sU -p 137 -oX - "$T"); echo "$out" | grep -E '<port ' || true
          [[ "$out" == *'protocol="udp" portid="137"><state state='* ]]        # UDP scan, as for NetBIOS names
          out=$(cockpit traceroute -n -I -q 1 -w 2 -m 3 "$T"); echo "$out"
          [[ "$out" == *"$T"* ]]                                                # ICMP traceroute
          docker run --rm --network host --cap-add NET_RAW -w /app/app localhost/netcockpit/cockpit:local python -c '
          import sys, scanner
          t = sys.argv[1]
          hosts = scanner.ping_sweep(t + "/32")
          ports = scanner.port_scan([t], [8000])
          print("ping_sweep:", hosts, "port_scan:", ports)
          assert hosts.get(t, {}).get("mac"), "the cockpit scan found no MAC address"
          assert ports.get(t) == [8000], "the cockpit port scan missed the open port"
          ' "$T"
          # sanity check: without raw packets the same scan fails, so the checks above do test the capability
          out=$(docker run --rm --network host --cap-drop NET_RAW localhost/netcockpit/cockpit:local nmap -Pn -n -sS -p 8000 "$T" 2>&1 || true)
          echo "$out" | tail -3
          if [[ "$out" == *"8000/tcp open"* ]]; then echo "SYN scan worked without NET_RAW: this check proves nothing"; exit 1; fi
          docker rm -f scan-target
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.demo.yml logs
