# Message d'accueil automatique pour le premier ticket d'une personne.
# Pas de message sur les pull requests : il faudrait le déclencheur pull_request_target, que GitHub restreint
# à partir du 2 décembre 2026 et qui donne des droits d'écriture à du code venu de forks.
name: Welcome

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  welcome:
    if: ${{ !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            Thanks for opening your first issue on NetCockpit! 🙌
            If it is a bug, the output of `docker compose ps` and `docker compose logs --tail 50 cockpit` (anonymised) helps a lot.
            Merci pour ce premier ticket ! Tu peux écrire en français ou en anglais.
          pr_message: |
            Thanks for your first pull request on NetCockpit! 🎉
            The CI runs the same checks as `CONTRIBUTING.md`; the demo (`python demo/demo.py`) is the quickest way to try UI changes.
            Merci pour cette première contribution !
