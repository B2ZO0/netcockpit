# Message d'accueil automatique pour le premier ticket ou la première pull request d'une personne.
name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue on NetCockpit! 🙌
            If it is a bug, the output of `docker compose ps` and `docker compose logs --tail 50 cockpit` (anonymised) helps a lot.
            Merci pour ce premier ticket ! Tu peux écrire en français ou en anglais.
          pr-message: |
            Thanks for your first pull request on NetCockpit! 🎉
            The CI runs the same checks as `CONTRIBUTING.md`; the demo (`python demo/demo.py`) is the quickest way to try UI changes.
            Merci pour cette première contribution !
